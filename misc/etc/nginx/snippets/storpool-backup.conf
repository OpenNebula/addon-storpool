# Include from each server block that proxies FireEdge.
# /storpool itself stays on FireEdge (the sidebar route). These two paths
# are the module script Sunstone loads at boot, and the summary page.
location = /storpool/remoteEntry.js {
    proxy_pass http://127.0.0.1:2874/remoteEntry.js;
}
location /storpool/api/ {
    proxy_pass http://127.0.0.1:2874/api/;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}
